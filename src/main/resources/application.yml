spring:
  application:
    name: payment-processing-system
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payments}
    username: ${DB_USERNAME:payments}
    password: ${DB_PASSWORD:payments}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  cache:
    type: redis
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: payment-processor
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.paymentprocessing.kafka
        spring.json.value.default.type: com.paymentprocessing.kafka.PaymentEvent

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-change-me-change-me}
    expiration: ${JWT_EXPIRATION:3600000}
  kafka:
    payment-topic: ${PAYMENT_EVENTS_TOPIC:payment-events}
    payment-dlq-topic: ${PAYMENT_EVENTS_DLQ_TOPIC:payment-events-dlq}
    max-retries: ${MAX_RETRIES:3}
    retry-backoff-ms: ${RETRY_BACKOFF_MS:2000}
  cache:
    payment-ttl: ${PAYMENT_CACHE_TTL:5m}
  outbox:
    batch-size: ${OUTBOX_BATCH_SIZE:25}
    fixed-delay-ms: ${OUTBOX_FIXED_DELAY_MS:2000}
  gateway:
    deterministic-fail-modulo: ${GATEWAY_DETERMINISTIC_FAIL_MODULO:5}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
